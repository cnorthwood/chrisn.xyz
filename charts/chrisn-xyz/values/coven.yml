ingress:
  hostname: chrisn.xyz
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd"
  tls:
    - hosts:
        - chrisn.xyz
      secretName: chrisn-xyz-tls
  probe:
    enabled: true

affinity:
  podAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: mariadb
            app.kubernetes.io/instance: chrisn-xyz-mariadb-cluster
            k8s.mariadb.com/role: primary
        topologyKey: coven.omelette.gay/location

mariadb-cluster:
  mariadb:
    metrics:
      enabled: true
  physicalBackups:
    - name: nightly
      schedule:
        cron: "18 22 * * *"
      storage:
        s3:
          bucket: coven-backups
          prefix: mariadb/chrisn-xyz
          region: europe-west2
          endpoint: storage.googleapis.com
          accessKeyIdSecretKeyRef:
            name: gcp-backups
            key: AWS_ACCESS_KEY_ID
          secretAccessKeySecretKeyRef:
            name: gcp-backups
            key: AWS_SECRET_ACCESS_KEY
      compression: gzip

uploadsStoragePvcLabels:
  recurring-job.longhorn.io/source: enabled
  recurring-job.longhorn.io/nightly-backup: enabled

# The object store is made by coven (coven/apps/chrisn-xyz.tf)
s3Uploads:
  enabled: true
  bucket: uploads
  endpoint: http://chrisn-xyz-rustfs-svc.chrisn-xyz.svc.cluster.local:9000
  bucketUrl: https://media.chrisn.xyz/uploads
  credentialsSecretName: chrisn-xyz-object-store-keys
