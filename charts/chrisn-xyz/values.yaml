# Default values for chrisn-xyz.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# the secret which contains the WordPress secrets
wordpressSecretsName: wordpress

# keep media uploads in an S3 bucket with the S3 Uploads plugin, rather than on disk
s3Uploads:
  enabled: false
  # bucket the plugin writes to, optionally with a path inside it (bucket/path)
  bucket: ""
  # the S3 API the plugin writes through
  endpoint: ""
  # the public URL the site links to the files at
  bucketUrl: ""
  # if false, the plugin is loaded but not used
  autoEnable: true
  # secret with the bucket's RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY
  credentialsSecretName: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  hostnames: [chrisn-xyz.local]
  annotations: {}
  tls: []
  probe:
    enabled: false
    blackboxExporterUrl: "blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115"

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/cnorthwood/chrisn.xyz
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

mariadb-cluster:
  mariadb:
    database: chrisn-xyz
    username: chrisn-xyz
    replicas: 1
    galera:
      enabled: false
    image: mariadb:12.3.4@sha256:7a6c5d2070f93bb2b233ca818e46dc5ae2f25dd655f794e5216e36dba2d114a3 # renovate: datasource=docker
    updateStrategy:
      mariadbAutoUpgradeEnabled: true
    # Set explicitly for the same reason as the image above: the operator fills in its default
    # exporter once and never changes it again. Renovate updates it the same way.
    metrics:
      exporter:
        image: prom/mysqld-exporter:v0.21.0@sha256:afad0c59a154fea24ca5ea0e6f95f2b0b168601b111266963dc8a347715b5318 # renovate: datasource=docker
