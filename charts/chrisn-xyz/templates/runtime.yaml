apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chrisn-xyz.fullname" . }}
  labels:
    {{- include "chrisn-xyz.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chrisn-xyz.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chrisn-xyz.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "chrisn-xyz.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 13 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: DB_HOST
              value: "{{ include "chrisn-xyz.fullname" . }}-mariadb-cluster"
            - name: DB_USER
              value: "{{ index .Values "mariadb-cluster" "mariadb" "username" }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ include "chrisn-xyz.fullname" . }}-mariadb-cluster-password"
                  key: password
            - name: DB_NAME
              value: "{{ index .Values "mariadb-cluster" "mariadb" "database" }}"
            - name: WP_ENV
              value: "production"
            - name: WP_HOME
              value: "https://{{ .Values.ingress.hostname }}"
            - name: WP_SITEURL
              value: "https://{{ .Values.ingress.hostname }}/wp"
            {{- with .Values.s3Uploads }}
            {{- if .enabled }}
            - name: S3_UPLOADS_BUCKET
              value: "{{ .bucket }}"
            - name: S3_UPLOADS_ENDPOINT
              value: "{{ .endpoint }}"
            - name: S3_UPLOADS_BUCKET_URL
              value: "{{ .bucketUrl }}"
            - name: S3_UPLOADS_AUTOENABLE
              value: "{{ .autoEnable }}"
            - name: S3_UPLOADS_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .credentialsSecretName }}"
                  key: RUSTFS_ACCESS_KEY
            - name: S3_UPLOADS_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .credentialsSecretName }}"
                  key: RUSTFS_SECRET_KEY
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: "{{ .Values.wordpressSecretsName }}"
          # Keeps a new pod out of the Service until nginx and PHP are answering, so a rolling update doesn't send traffic
          # to it early. The Host header makes WordPress serve the front page rather than redirect to it
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: "{{ .Values.ingress.hostname }}"
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /app/web/app/uploads/
              name: wp-uploads
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      restartPolicy: Always
      volumes:
        - name: wp-uploads
          persistentVolumeClaim:
            claimName: {{ include "chrisn-xyz.fullname" . }}-wp-uploads
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
